# Rootless Podman overrides: unprivileged host ports, SELinux volume labels, no cgroup host mode.
services:
  uyuni-dev:
    cgroup: private
    volumes:
      - ../../:/workspaces/uyuni:z
    ports:
      - "8443:443"
      - "8080:80"
      - "4505:4505"
      - "4506:4506"
      - "15432:5432"
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
  db:
    volumes:
      - ../../:/manager:z
